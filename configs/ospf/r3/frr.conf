! R3 — cenário OSPFv2, área 0. LAN 192.168.3.0/24.
! Vizinhos: R2 (ring23, 10.0.23.0/29) e R4 (ring34, 10.0.34.0/29).
!
! Cabeçalho do FRR: versão, padrões "traditional", nome do roteador, log na saída
! do contêiner (docker logs) e um único frr.conf para todos os daemons.
frr version 10.7.0
frr defaults traditional
hostname r3
log stdout
service integrated-vtysh-config
!
! Enlaces do anel. point-to-point: só dois roteadores OSPF no /29 (o gateway do
! Docker não fala OSPF), então não há eleição de DR/BDR e a adjacência sobe
! mais rápido. cost 10 fixo em todos: não depende da velocidade que o kernel
! informa para a veth, e o custo do caminho passa a ser 10 por enlace.
! ring23: enlace com R2.
interface ring23
 ip ospf network point-to-point
 ip ospf cost 10
!
! ring34: enlace com R4.
interface ring34
 ip ospf network point-to-point
 ip ospf cost 10
!
! LAN passiva: a rede entra no OSPF, mas não há Hello para os hosts.
interface lan
 ip ospf passive
!
! Área 0 (backbone) única para os cinco roteadores. Cada network coloca na área
! as interfaces com endereço no prefixo: a LAN e os dois enlaces do anel.
router ospf
 ospf router-id 3.3.3.3
 network 192.168.3.0/24 area 0
 network 10.0.23.0/29 area 0
 network 10.0.34.0/29 area 0
!
