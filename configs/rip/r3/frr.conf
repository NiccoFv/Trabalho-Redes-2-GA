! R3 — cenário RIPv2. LAN 192.168.3.0/24.
! Vizinhos: R2 (ring23, 10.0.23.0/29) e R4 (ring34, 10.0.34.0/29).
!
! Cabeçalho do FRR: versão, padrões "traditional", nome do roteador, log na saída
! do contêiner (docker logs) e um único frr.conf para todos os daemons.
frr version 10.7.0
frr defaults traditional
hostname r3
log stdout
service integrated-vtysh-config
!
router rip
 ! version 2: envia e aceita só RIPv2, que leva a máscara no anúncio (necessária
 ! para /24 e /29) e usa multicast 224.0.0.9.
 version 2
 ! LAN passiva: a rede é anunciada, mas não se envia update para os hosts.
 passive-interface lan
 ! network: habilita o RIP nas interfaces desses prefixos (LAN e os dois enlaces
 ! do anel) e anuncia as redes. Métrica = saltos; 16 = inalcançável.
 network 192.168.3.0/24
 network 10.0.23.0/29
 network 10.0.34.0/29
!
