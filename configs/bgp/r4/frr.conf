! R4 — cenário BGP. AS65003, LAN 192.168.4.0/24.
! Vizinhos: R3 10.0.34.1 (eBGP, AS65002) e R5 10.0.45.2 (iBGP, AS65003).
!
! Cabeçalho do FRR: versão, padrões "traditional", nome do roteador, log na saída
! do contêiner (docker logs) e um único frr.conf para todos os daemons.
frr version 10.7.0
frr defaults traditional
hostname r4
log stdout
service integrated-vtysh-config
!
! Prefix-list LANS: só as cinco LANs /24 entram ou saem pelas sessões eBGP.
! Os /29 do anel nunca são anunciados.
ip prefix-list LANS seq 10 permit 192.168.1.0/24
ip prefix-list LANS seq 20 permit 192.168.2.0/24
ip prefix-list LANS seq 30 permit 192.168.3.0/24
ip prefix-list LANS seq 40 permit 192.168.4.0/24
ip prefix-list LANS seq 50 permit 192.168.5.0/24
! Processo BGP do AS65003; router-id fixo identifica R4 nas sessões.
router bgp 65003
 bgp router-id 4.4.4.4
 ! ebgp-requires-policy (RFC 8212): sessão eBGP sem política de entrada e saída
 ! não troca rotas. A prefix-list LANS cumpre esse requisito.
 bgp ebgp-requires-policy
 ! Sessões pelos endereços do enlace direto: remote-as igual ao próprio AS = iBGP;
 ! diferente = eBGP.
 neighbor 10.0.34.1 remote-as 65002
 neighbor 10.0.45.2 remote-as 65003
 address-family ipv4 unicast
  ! network: origina só a LAN local, que existe na tabela como rede conectada.
  network 192.168.4.0/24
  ! Filtro LANS nos dois sentidos da sessão eBGP com R3.
  neighbor 10.0.34.1 prefix-list LANS in
  neighbor 10.0.34.1 prefix-list LANS out
  ! next-hop-self: R4 anuncia a R5 as rotas aprendidas de R3 com o próprio
  ! endereço como próximo salto. Sem isso R5 receberia 10.0.34.1, que não
  ! alcança: não há IGP e os /29 não são anunciados.
  neighbor 10.0.45.2 next-hop-self
 exit-address-family
!
